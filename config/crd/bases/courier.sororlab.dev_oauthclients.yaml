---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: oauthclients.courier.sororlab.dev
spec:
  group: courier.sororlab.dev
  names:
    kind: OAuthClient
    listKind: OAuthClientList
    plural: oauthclients
    shortNames:
    - oac
    singular: oauthclient
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .spec.clientType
      name: Type
      type: string
    - jsonPath: .status.clientId
      name: Client ID
      type: string
    - jsonPath: .status.secretPath
      name: Secret Path
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OAuthClient requests an OAuth client in the identity provider, with its
          credentials delivered to the owning team's Vault path.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of OAuthClient
            properties:
              allowGroups:
                description: allowGroups may sign in through the client. Defaults
                  to the owner group.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              clientType:
                description: clientType is public (PKCE, no secret) or confidential
                  (secret delivered to Vault).
                enum:
                - public
                - confidential
                type: string
              displayName:
                description: displayName is shown in the identity provider. Defaults
                  to <namespace>/<name>.
                type: string
              grantTypes:
                description: grantTypes the client may use.
                items:
                  enum:
                  - authorization_code
                  - refresh_token
                  - client_credentials
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              ownerGroup:
                description: |-
                  ownerGroup is the IdP group that owns the client and can read its
                  credentials. It must equal the namespace; empty means the namespace.
                type: string
              redirectUris:
                description: redirectUris must be https, except http loopback for
                  public clients.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              scopes:
                description: scopes requested by the client. Defaults to [openid].
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
            required:
            - clientType
            - grantTypes
            type: object
            x-kubernetes-validations:
            - message: client_credentials requires clientType confidential
              rule: self.clientType == 'confidential' || !self.grantTypes.exists(g,
                g == 'client_credentials')
            - message: authorization_code requires at least one redirect URI
              rule: '!self.grantTypes.exists(g, g == ''authorization_code'') || (has(self.redirectUris)
                && size(self.redirectUris) > 0)'
          status:
            description: status defines the observed state of OAuthClient
            properties:
              clientId:
                description: clientId of the client in the identity provider. Not
                  sensitive.
                type: string
              conditions:
                description: 'conditions: Ready is True when the client exists and
                  credentials are available.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              credentialsDelivered:
                description: credentialsDelivered is true once credentials were stored
                  and are live.
                type: boolean
              identityProvider:
                description: identityProvider is the adapter that manages the client.
                type: string
              lastSecretIssued:
                description: lastSecretIssued is when Courier last generated a client
                  secret.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the spec generation last reconciled.
                format: int64
                type: integer
              secretPath:
                description: secretPath is where the owning team reads the credentials.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
