# This rule is not used by the project courier itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the courier.sororlab.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: courier
    app.kubernetes.io/managed-by: kustomize
  name: oauthclient-editor-role
rules:
- apiGroups:
  - courier.sororlab.dev
  resources:
  - oauthclients
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - courier.sororlab.dev
  resources:
  - oauthclients/status
  verbs:
  - get
