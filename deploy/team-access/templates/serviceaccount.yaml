{{- if not .Values.team }}{{ fail "values.team is required" }}{{ end }}
# External Secrets logs in to Vault as this service account. Vault role
# {{ .Values.team }} is bound to it and grants only policy {{ .Values.team }}.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName }}
  namespace: {{ .Values.team }}
  labels:
    app.kubernetes.io/part-of: courier
automountServiceAccountToken: false
