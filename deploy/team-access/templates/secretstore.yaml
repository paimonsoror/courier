# Namespaced on purpose: one store per team, each logging in with its own
# role, so no store in the cluster can read another team's credentials.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: courier-vault
  namespace: {{ .Values.team }}
  labels:
    app.kubernetes.io/part-of: courier
spec:
  provider:
    vault:
      server: {{ .Values.vault.server | quote }}
      path: {{ .Values.vault.kvMount | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: {{ .Values.vault.authMount | quote }}
          role: {{ .Values.team | quote }}
          serviceAccountRef:
            name: {{ .Values.serviceAccountName }}
