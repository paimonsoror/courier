# How team-bravo's report exporter gets its credentials as a Kubernetes Secret.
# This lives with the team's own application manifests, not in requests/.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: report-exporter-oauth
  namespace: team-bravo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: courier-vault
    kind: SecretStore
  target:
    name: report-exporter-oauth
    creationPolicy: Owner
    # When the request is retired, Courier destroys the vault entry. Delete the
    # Kubernetes Secret too, instead of keeping a dead credential around.
    deletionPolicy: Delete
  dataFrom:
    - extract:
        key: teams/team-bravo/oauth-clients/team-bravo-report-exporter
