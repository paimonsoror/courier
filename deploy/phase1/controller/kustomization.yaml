# Homelab install of the Courier controller: the kubebuilder default
# (CRD, RBAC, manager in courier-system) plus image and wiring.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../config/default

images:
  # Built by .github/workflows/controller-image.yml; pinned by digest.
  # sha-2ed3a9d = commit 2ed3a9d (resync fix).
  - name: controller
    newName: ghcr.io/paimonsoror/courier-controller
    digest: sha256:ada7be47e996b26c10f7d358396ef2d267a0ee7cfc8e0534220eec9c5400e35e

patches:
  - path: manager-wiring.yaml
    target:
      kind: Deployment
