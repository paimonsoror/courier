# Homelab install of the Courier controller: the kubebuilder default
# (CRD, RBAC, manager in courier-system) plus image and wiring.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../config/default

images:
  # Built by .github/workflows/controller-image.yml; pinned by digest.
  # sha-8e454ad = commit 8e454ad (Phase 4 + redirect_uri_type drift fix).
  - name: controller
    newName: ghcr.io/paimonsoror/courier-controller
    digest: sha256:34023d6eeb14ba1efe231bb6f2b8442665a810e3a2de04680e8aba2485a3fc44

patches:
  - path: manager-wiring.yaml
    target:
      kind: Deployment
