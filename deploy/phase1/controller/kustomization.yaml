# Homelab install of the Courier controller: the kubebuilder default
# (CRD, RBAC, manager in courier-system) plus image and wiring.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../config/default

images:
  # Built by .github/workflows/controller-image.yml; pinned by digest.
  # sha-faf6004 = commit faf6004 (Phase 4: rotation, adoption, quiet drift repair).
  - name: controller
    newName: ghcr.io/paimonsoror/courier-controller
    digest: sha256:27abaafb25cdb4bb7315ac85ae41b2278a6106a466a0d1f3a06d6807793a3861

patches:
  - path: manager-wiring.yaml
    target:
      kind: Deployment
